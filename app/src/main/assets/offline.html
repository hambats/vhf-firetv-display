<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Veterans Healing Farm</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f1a12; color: #f4f1e8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 4vh 6vw; }
  .eyebrow { letter-spacing: .28em; text-transform: uppercase;
    font-size: 1.4vw; opacity: .65; margin: 0 0 2vh; }
  h1 { font-size: 4.2vw; font-weight: 600; margin: 0 0 2.5vh; }
  p { font-size: 1.7vw; line-height: 1.6; opacity: .78; max-width: 52ch; margin: 0; }
  .dot { display: inline-block; width: .5em; height: .5em; border-radius: 50%;
    background: #8fbf7a; margin-right: .6em; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Veterans Healing Farm</p>
    <h1>Reconnecting</h1>
    <p><span class="dot"></span>The display is waiting for the network. It will come back
       on its own — nothing needs to be done.</p>
  </div>
</body>
</html>
