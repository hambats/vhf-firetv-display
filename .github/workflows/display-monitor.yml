# Ask the television how it is, on a schedule, from CI.
#
# Nothing noticed a dead display. The only detection mechanism this project has
# ever had is a human walking past the television, and the farm is closed Sunday
# and Monday -- so a Friday evening failure could sit dark in a public building
# until Tuesday.
#
# This pulls rather than having the page push a heartbeat, because a heartbeat
# proves the page's JavaScript ran while this proves what is on the screen. We
# have already hit a case where those differ: after a sleep/wake cycle the
# television came back on the Fire TV launcher with our app perfectly healthy
# behind it.
#
# It needs no code on the device. Every probe is a stock adb command run as uid
# `shell`. The Tailscale credential lives here in CI, never on the display.
#
# STARTS IN OBSERVE MODE. It records faults and exits 0, so we learn its
# false-positive rate before it is allowed to cry wolf. Flip MONITOR_OBSERVE to
# "false" once a few days of runs look trustworthy -- an alert nobody believes
# is the same as no alert.

name: display monitor

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and commonly runs late
    # under load, so treat the real detection latency as ~20-30 minutes rather
    # than 15. Still days better than waiting for someone to walk past.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      observe:
        description: "Record faults without failing the run"
        type: boolean
        default: true

concurrency:
  # Never let a slow run pile up behind another; the newest answer is the only
  # one worth having.
  group: display-monitor
  cancel-in-progress: false

permissions:
  contents: read

env:
  MONITOR_OBSERVE: "true"
  VHF_DEVICE: "100.69.183.1:5555"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # The job is useless without a way onto the tailnet, and a run that fails
      # for want of a secret is noise that trains people to ignore this
      # workflow. Say so plainly and stop.
      # Accepts TS_AUTHKEY or TS_AUTH_KEY because both are names a reasonable
      # person types, and a monitor that silently skips over a one-underscore
      # difference is precisely the silent failure this workflow exists to stop.
      # It also reports a *partial* credential distinctly: an OAuth secret with
      # no client id cannot authenticate, and "no credential configured" would
      # be a misleading thing to read while staring at a secret you just set.
      - name: Check the Tailscale credential is present
        id: creds
        run: |
          if [ -n "${{ secrets.TS_AUTHKEY }}" ] || [ -n "${{ secrets.TS_AUTH_KEY }}" ]; then
            echo "Using a Tailscale auth key."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.TS_OAUTH_CLIENT_ID }}" ] && [ -n "${{ secrets.TS_OAUTH_SECRET }}" ]; then
            echo "Using a Tailscale OAuth client."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.TS_OAUTH_SECRET }}" ]; then
            echo "::warning::Found TS_OAUTH_SECRET but no TS_OAUTH_CLIENT_ID — an OAuth client is a pair. Set the client id too, or use TS_AUTHKEY for a plain auth key. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Tailscale credential configured — set TS_AUTHKEY (or TS_AUTH_KEY), or TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Install adb
        if: steps.creds.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq android-tools-adb

      # Ephemeral node: it joins for this run and removes itself afterwards, so
      # the tailnet does not slowly fill with dead CI machines.
      - name: Join the tailnet
        if: steps.creds.outputs.ready == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_ID && secrets.TS_OAUTH_SECRET }}
          authkey: ${{ secrets.TS_AUTHKEY || secrets.TS_AUTH_KEY }}
          # No `tags:` on purpose. Advertising tag:ci requires that tag to be
          # declared in the tailnet policy's tagOwners, and Tailscale refuses
          # the login outright if it is not -- which presents as a node that
          # joined fine and simply cannot see anything. `tailscale status` said
          # "Logged out." while the step itself reported success.
          #
          # Omitting it is also strictly more permissive of how the key was
          # made: a key that already carries tags applies them anyway.
          #
          # The cost is scope. An untagged node is an ordinary member device
          # covered by whatever the tailnet grants members -- here, everything.
          # To narrow it to adb on the display alone, declare the tag and grant
          # it explicitly, then put `tags: tag:ci` back:
          #   "tagOwners": { "tag:ci": ["autogroup:admin"] }
          #   grants: { "src": ["tag:ci"], "dst": ["100.69.183.1"], "ip": ["5555"] }
          version: latest

      # Prove whether the tailnet path exists before blaming the television.
      # A failed `adb connect` looks identical whether the node never joined,
      # the ACL refuses the tag, or the display is genuinely down -- and sending
      # someone to the building on the wrong one of those is expensive.
      - name: Prove the tailnet path
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        run: |
          echo "--- this node ---"
          tailscale status --self --peers=false || true
          echo "--- can it see the display? ---"
          tailscale status | grep -i vhf || echo "display not in peer list"
          echo "--- direct path test ---"
          tailscale ping --timeout 5s --c 3 100.69.183.1 || echo "tailscale ping failed"
          echo "--- tcp 5555 ---"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/100.69.183.1/5555' \
            && echo "port 5555 OPEN" || echo "port 5555 unreachable"

      - name: Check the display
        if: steps.creds.outputs.ready == 'true'
        id: check
        env:
          VHF_DEVICE: ${{ env.VHF_DEVICE }}
        run: |
          OBSERVE="${{ github.event.inputs.observe || env.MONITOR_OBSERVE }}"
          FLAGS=""
          if [ "$OBSERVE" = "true" ]; then FLAGS="--observe"; fi
          node scripts/check-display.mjs $FLAGS \
            --screenshot display-screenshot.png \
            --json display-report.json

      # The screenshot is the point. A status line says the app is in front; the
      # image says whether a visitor is looking at a VHF scene or at a frozen
      # crossfade. Kept for a fortnight so a "when did this start?" question has
      # an answer.
      - name: Keep the evidence
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: display-${{ github.run_id }}
          path: |
            display-screenshot.png
            display-report.json
          retention-days: 14
          if-no-files-found: warn

      - name: Summarise
        if: always() && steps.creds.outputs.ready == 'true'
        run: |
          {
            echo "### Display check"
            if [ -f display-report.json ]; then
              node -e '
                const r = require("./display-report.json");
                console.log("**Status:** " + r.status.toUpperCase() + (r.closedDay ? " _(closed day — a black screen is correct)_" : ""));
                console.log("");
                console.log("| | |");
                console.log("|---|---|");
                console.log("| Foreground | `" + (r.facts.foreground || "-") + "` |");
                console.log("| Screen | " + (r.facts.screenOn === null ? "-" : r.facts.screenOn ? "ON" : "OFF") + " |");
                console.log("| Uptime | " + (r.facts.uptime || "-") + " |");
                console.log("| Screenshot | " + (r.facts.screenshotBytes || 0) + " bytes |");
                if (r.findings.length) {
                  console.log("");
                  for (const f of r.findings) console.log("- **" + f.severity + "** `" + f.code + "` — " + f.detail);
                }
              '
            else
              echo "No report produced — the check did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
